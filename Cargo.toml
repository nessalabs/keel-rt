[package]
name = "keel-rt"
version = "0.1.0"
edition = "2021"
description = "small DAG workflow execution kernel"
license = "MIT"
readme = "README.md"
keywords = ["workflow", "dag", "runtime", "kernel"]
categories = ["asynchronous"]

[features]
default = []
test-util = []

[dependencies]
async-trait = "0.1"
bytes = { version = "1.9", features = ["serde"] }
serde = { version = "1.0.216", features = ["derive"] }
thiserror = "2.0.9"
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7.13", features = ["rt"] }
tracing = "0.1.41"
# Rust 1.83 cannot parse edition2024 manifests pulled by latest indexmap.
indexmap = "=2.7.1"

[dev-dependencies]
keel-rt = { path = ".", features = ["test-util"] }
tokio = { version = "1.43", features = ["full", "test-util"] }
