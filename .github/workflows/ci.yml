name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          components: clippy, rustfmt
      - run: cargo fmt -p keel-rt-wasm -p keel-rt-wasm-consumer-test --check
      - run: cargo clippy --locked --workspace --lib -- -D warnings
      - run: cargo clippy --locked -p keel-rt-wasm -p keel-rt-wasm-consumer-test --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
      - name: Run every workspace suite once
        # Release keeps the 100k hang bounds meaningful on shared runners.
        # Includes adversarial, stress, chaos, durable startup, and Wasm tests.
        run: cargo test --locked --release --workspace -- --test-threads=1

  pr-body:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Mermaid + When a caller + base main
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: python3 scripts/pr_body_gate.py

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: cargo-llvm-cov@0.6.16
      - name: Kernel coverage gate
        env:
          COVERAGE_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'HEAD^' }}
        run: |
          git rev-parse --verify "${COVERAGE_DIFF_BASE}^{commit}"
          ./scripts/coverage.sh
      - name: Upload lcov
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lcov
          path: |
            coverage/lcov.info
            coverage/BASELINE
          if-no-files-found: warn

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install and run actionlint 1.7.12
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  ci-pass:
    if: always()
    needs: [clippy, test, pr-body, coverage, workflow-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          failed = []
          for name, job in json.loads(os.environ["RESULTS"]).items():
              if name == "pr-body" and os.environ["EVENT"] != "pull_request" and job["result"] == "skipped":
                  continue
              if job["result"] != "success":
                  failed.append(f"{name}: {job['result']}")
          if failed:
              sys.exit("CI did not pass: " + ", ".join(failed))
          print("All applicable CI jobs passed")
          PYTHON
