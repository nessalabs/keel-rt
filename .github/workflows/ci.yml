name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - run: cargo clippy --workspace --lib -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Default suite (no 100k, no resume_stress)
        run: |
          cargo test -p keel-rt --lib \
            --test adversarial --test catalog --test consumer --test events \
            --test graph --test resilience --test resume --test timers \
            --test scenarios --test stress --test stress_uneven --test structure \
            --test workloads \
            -- --test-threads=1
          cargo test -p keel-rt-sqlite --lib --test resume --test structure \
            -- --test-threads=1
          cargo test -p keel-rt-http -- --test-threads=1
          cargo test -p keel-rt-schedule -- --test-threads=1

  adversarial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Adversarial + resume hunt
        run: |
          cargo test -p keel-rt --test adversarial -- --test-threads=1
          cargo test -p keel-rt-sqlite --test resume -- --test-threads=1

  pr-body:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mermaid + When a caller + base main
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: python3 scripts/pr_body_gate.py

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.6.16
      - name: Kernel coverage gate
        env:
          COVERAGE_DIFF_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
        run: |
          git fetch --no-tags origin main 2>/dev/null || true
          chmod +x scripts/coverage.sh
          ./scripts/coverage.sh
      - name: Upload lcov
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: |
            coverage/lcov.info
            coverage/BASELINE
          if-no-files-found: warn

  stress-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Sqlite resume stress
        run: cargo test -p keel-rt-sqlite --test resume_stress -- --test-threads=1 --nocapture

  stress-100k:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: 100k scale (no coverage instrumentation)
        # Release: debug wide_100k is ~57s locally / can exceed the 90s
        # hang-bound on GHA; release is ~4s and keeps the same assertions.
        run: cargo test --release --test stress_100k -- --test-threads=1 --nocapture

  chaos-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Standing sqlite chaos / crash-inject
        run: cargo test -p keel-rt-sqlite --test chaos --test crash_inject -- --test-threads=1 --nocapture
