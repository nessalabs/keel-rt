name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.83.0
        with:
          components: clippy
      - run: cargo clippy --lib -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.83.0
      - name: Default suite (no 100k)
        run: |
          cargo test --lib \
            --test adversarial --test catalog --test consumer --test graph --test resilience \
            --test scenarios --test stress --test stress_uneven --test structure \
            --test workloads \
            -- --test-threads=1

  stress-100k:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.83.0
      - name: 100k scale (no coverage instrumentation)
        run: cargo test --test stress_100k -- --test-threads=1 --nocapture

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.83.0
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.6.16
      - name: Kernel coverage gate
        env:
          COVERAGE_DIFF_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
        run: |
          git fetch --no-tags origin main 2>/dev/null || true
          chmod +x scripts/coverage.sh
          ./scripts/coverage.sh
      - name: Upload lcov
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: |
            coverage/lcov.info
            coverage/BASELINE
          if-no-files-found: warn
