[package]
name = "keel-rt-http"
version = "0.1.0"
edition = "2021"
description = "HTTP adapter: GET /inspect + POST /complete and KeelClient (not the kernel)"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.7", default-features = false, features = ["json", "tokio", "http1"] }
bytes = { version = "1.9", features = ["serde"] }
http-body-util = "0.1.0"
hyper = { version = "1.5", default-features = false, features = ["http1", "client"] }
hyper-util = { version = "0.1.3", default-features = false, features = ["client-legacy", "http1", "tokio"] }
keel-rt = { path = "../.." }
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.9"
tokio = { version = "1.43", features = ["net", "rt", "macros", "time"] }

[dev-dependencies]
keel-rt = { path = "../..", features = ["test-util"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full", "test-util"] }
